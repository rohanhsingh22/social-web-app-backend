name: Build HiRotoli Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Verify Linux Prisma Engine
        run: |
          test -f node_modules/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node
          echo "Linux Prisma engine found:"
          ls -lh node_modules/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node

      - name: Build NestJS
        run: npm run build

      - name: Verify worker build
        run: |
          test -f dist/src/apps/worker/main.js
          echo "Worker build verified:"
          ls -lh dist/src/apps/worker/main.js

      - name: Remove development dependencies
        run: npm prune --omit=dev

      - name: Verify Prisma Engine After Prune
        run: |
          test -f node_modules/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node
          echo "Linux Prisma engine still present after npm prune"

      - name: Prepare worker bundle
        run: |
          mkdir -p worker-bundle

          cp -r dist worker-bundle/
          cp -r node_modules worker-bundle/
          cp package.json worker-bundle/
          cp package-lock.json worker-bundle/

      - name: Verify worker bundle
        run: |
          test -f worker-bundle/dist/src/apps/worker/main.js
          test -d worker-bundle/node_modules
          test -f worker-bundle/node_modules/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node

          echo "Worker bundle ready"
          echo "Worker entry:"
          ls -lh worker-bundle/dist/src/apps/worker/main.js

          echo "Prisma Linux engine:"
          ls -lh worker-bundle/node_modules/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node

          echo "Bundle size:"
          du -sh worker-bundle

      - name: Upload worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: hirotoli-worker-uat
          path: worker-bundle
          include-hidden-files: true
          retention-days: 7
